name: bot

# Manual paper-bot replay: recomputes the simulation from data already in the
# database (no market fetching, ~1-2 min). Triggered by the "Run now" button
# on the /bot page (via workflow dispatch) or manually from the Actions tab.
on:
  workflow_dispatch: {}

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Replay bot simulation
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u run_bot.py
