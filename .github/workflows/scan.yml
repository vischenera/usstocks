name: scan

# Self-driving market scan. Runs daily after the US close and on manual trigger.
# The worker is a state machine: it backfills first (resuming if interrupted),
# then switches to daily incremental updates automatically.
on:
  schedule:
    # Every 15 min while backfilling (repo is public → free minutes), so a
    # rate-limit pause resumes quickly instead of waiting for the next day.
    # TODO: once the backfill finishes and the repo goes private, delete this
    # line and keep only the 22:00 UTC daily cron below.
    #- cron: "*/15 * * * *"
    # 22:00 UTC ≈ shortly after the US market close. Runs every day.
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button (use during initial backfill)

concurrency:
  group: scan
  cancel-in-progress: false   # never interrupt an in-flight scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # well under the 6h hard cap; covers a full backfill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      # Carries worker/.cache (the OHLCV snapshot, see worker/cache.py) between
      # runs so the scan doesn't need to re-pull the whole table from Postgres
      # every day — that was blowing through Neon's free-tier transfer quota.
      # restore-keys always picks up the most recent snapshot; the exact `key`
      # (unique per run) makes actions/cache save a fresh one at the end.
      - name: Restore OHLCV cache
        uses: actions/cache@v4
        with:
          path: worker/.cache
          key: ohlcv-cache-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run scan
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u run.py
